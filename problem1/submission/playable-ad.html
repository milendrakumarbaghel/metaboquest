 trials, many people regained a good part of the weight after stopping, so the plan for after (food habits, movement, follow-ups) matters as much as the plan for during. Festival weeks and travel are normal life, so a plan should expect them.`},{value:`DIABETES`,label:`Is it only for diabetes?`,question:`Do my tests, waist and family history suggest any prescription treatment could suit me, with or without diabetes?`,takeaway:`These medicines were first used for type 2 diabetes and some are also used for weight management. The question is not “diabetic or not” but whether it suits you. Indians can carry metabolic risk at lower body weights, so a doctor looks at tests, waist and family history, not one sugar report.`},{value:`ELIGIBILITY`,label:`Is it even for me?`,question:`Would any prescription treatment be appropriate for me, and what alternatives are there?`,takeaway:`No quiz can tell you whether a medicine is right for you. A doctor decides after your tests, history and goals. Sometimes the answer is “not now”, and food, movement and behavioural support still help.`},{value:`GENERAL`,label:`Just curious`,question:`What should I understand before considering a weight-management programme?`,takeaway:`GLP-1 medicines are one tool inside doctor-led care. Tests come first, a doctor decides if they fit, and habits plus follow-up are what make results last.`}],Or={SAFETY:[`SIDE_EFFECTS`,`ELIGIBILITY`],SIDE_EFFECTS:[`SAFETY`],MUSCLE:[`MAINTENANCE`,`SAFETY`],MAINTENANCE:[`MUSCLE`,`ELIGIBILITY`],DIABETES:[`ELIGIBILITY`,`SAFETY`],ELIGIBILITY:[`DIABETES`,`SAFETY`]},kr={reviewedBy:null}}));function jr(e,t={},n){if(ur.mode!==`connected`||P.get(`analytics-consent`)!==!0)return;let r=Mr[e];pr(`/api/v1/analytics/events`,{method:`POST`,body:{eventType:e,metadata:Object.fromEntries(Object.entries(t).filter(([e,t])=>r.includes(e)&&(typeof t!=`string`||t.length<=100))),consentGranted:!0,...n?{sessionId:n}:{}}}).catch(()=>{})}var Mr,Nr=o((()=>{dr(),gr(),or(),Mr={GAME_STARTED:[`source`,`platform`],QUESTION_ANSWERED:[`questionId`,`responseTimeMs`],GAME_COMPLETED:[`durationMs`],RESULT_SHARED:[`channel`],FRIEND_CHALLENGE_CREATED:[],FRIEND_CHALLENGE_OPENED:[`challengeCode`],CTA_CLICKED:[`destination`,`ctaContext`],TOPIC_SELECTED:[`topic`]}})),Pr,Fr,Ir,Lr=o((()=>{Pr=[{title:`Prescription Medications to Treat Overweight and Obesity`,organization:`NIDDK`,url:`https://www.niddk.nih.gov/health-information/weight-management/prescription-medications-treat-overweight-obesity`},{title:`Food and nutrition when taking weight-loss medicines`,organization:`Guy’s and St Thomas’ NHS Foundation Trust`,url:`https://www.guysandstthomas.nhs.uk/health-information/dietary-advice-people-taking-weight-loss-medicines/food-and-nutrition`},{title:`Managing side effects with diet`,organization:`Guy’s and St Thomas’ NHS Foundation Trust`,url:`https://www.guysandstthomas.nhs.uk/health-information/lifestyle-advice-people-taking-weight-loss-medicines/managing-side-effects-diet`},{title:`Semaglutide`,organization:`NHS`,url:`https://www.nhs.uk/medicines/semaglutide/`}],Fr=[{number:10,topic:`SAFETY`,type:`SCENARIO_BASED`,category:`TREATMENT_SAFETY`,text:`A family WhatsApp group recommends a GLP-1 medicine. Is that enough to decide it is safe for you?`,options:[`Yes, if someone I trust uses it`,`No, I need an individual medical review`],correct:1,explanation:`Someone else’s experience cannot establish your safety. A clinician needs to review your history, medicines and possible benefits and risks.`,source:0},{number:11,topic:`MUSCLE`,type:`SCENARIO_BASED`,category:`NUTRITION`,text:`Your usual lunch is roti and sabzi. Which addition can help include protein?`,options:[`Dal, chana, curd or another suitable protein food`,`Skipping lunch altogether`],correct:0,explanation:`Protein foods can help support muscle during weight loss. Pulses and dairy are options; your dietitian can adapt choices to your needs. Food alone cannot guarantee muscle preservation.`,source:1},{number:12,topic:`MUSCLE`,type:`MYTH_OR_FACT`,category:`HEALTHY_HABITS`,text:`Myth or fact: eating less is all you need to think about to protect muscle during weight loss.`,options:[`Fact`,`Myth`],correct:1,explanation:`Myth. Nutrition and strength-building activity both matter. Ask your care team about suitable protein foods and resistance exercise, adapted to your abilities.`,source:1},{number:13,topic:`SIDE_EFFECTS`,type:`MULTIPLE_CHOICE`,category:`GLP1_AWARENESS`,text:`Which can occur with GLP-1 weight-management medicines?`,options:[`Nausea or constipation`,`No digestive side effects at all`],correct:0,explanation:`Nausea, vomiting, diarrhoea and constipation can occur. These medicines slow food moving through the gut. Discuss symptoms with your care team.`,source:2},{number:14,topic:`SIDE_EFFECTS`,type:`SCENARIO_BASED`,category:`TREATMENT_SAFETY`,text:`A friend taking a weight-management medicine cannot keep fluids down. What is the safer response?`,options:[`Ignore it because all side effects are harmless`,`Seek prompt medical help`],correct:1,explanation:`Being unable to keep fluids down can lead to dehydration and needs medical attention. Do not dismiss persistent or worsening symptoms as a normal part of treatment.`,source:2},{number:15,topic:`SIDE_EFFECTS`,type:`MYTH_OR_FACT`,category:`TREATMENT_SAFETY`,text:`Myth or fact: everyone gets exactly the same side effects from a weight-management medicine.`,options:[`Myth`,`Fact`],correct:0,explanation:`Myth. Side effects differ between medicines and people. An individual discussion of risks and follow-up is important; a quiz cannot predict your experience.`,source:0},{number:16,topic:`SIDE_EFFECTS`,type:`SCENARIO_BASED`,category:`TREATMENT_SAFETY`,text:`Your work commute is difficult because of persistent nausea on treatment. What next?`,options:[`Copy a dose change suggested online`,`Contact the prescribing team for advice`],correct:1,explanation:`Follow your prescription instructions and ask your doctor or pharmacist about problems. Do not copy another person’s dosing schedule.`,source:3},{number:17,topic:`MAINTENANCE`,type:`MYTH_OR_FACT`,category:`DOCTOR_LED_CARE`,text:`Myth or fact: stopping a weight-management medicine guarantees the weight stays off.`,options:[`Fact`,`Myth`],correct:1,explanation:`Myth. Weight regain can happen after stopping treatment. Discuss a long-term plan with your clinician; neither medicine nor habits offer a permanent-results guarantee.`,source:0},{number:18,topic:`ELIGIBILITY`,type:`MYTH_OR_FACT`,category:`GLP1_AWARENESS`,text:`Myth or fact: GLP-1 medicines are only ever used for diabetes.`,options:[`Myth`,`Fact`],correct:0,explanation:`Myth. Some GLP-1 medicines are used for weight management as well as diabetes. Uses differ by product and local approval; this does not mean everyone is eligible.`,source:3},{number:19,topic:`ELIGIBILITY`,type:`SCENARIO_BASED`,category:`DOCTOR_LED_CARE`,text:`A colleague says a GLP-1 medicine worked for them. Does that mean it suits you?`,options:[`Yes, colleagues can use the same plan`,`No, suitability needs an individual assessment`],correct:1,explanation:`Treatment suitability depends on your health and circumstances. A qualified clinician, not a friend’s result, should assess whether prescription treatment is appropriate.`,source:0},{number:20,topic:`ELIGIBILITY`,type:`MULTIPLE_CHOICE`,category:`GLP1_AWARENESS`,text:`What can this three-question quiz tell you?`,options:[`What you learned—not whether you qualify for medicine`,`Which medicine you should start`],correct:0,explanation:`This is an educational quiz, not a clinical assessment. Prescription decisions require a qualified clinician and an individual discussion.`,source:0},{number:21,topic:`ELIGIBILITY`,type:`SCENARIO_BASED`,category:`TREATMENT_SAFETY`,text:`A cousin offers their prescribed GLP-1 medicine so you can try it. What should you do?`,options:[`Try it before booking a consultation`,`Do not use someone else’s prescription; seek your own medical advice`],correct:1,explanation:`These are prescription medicines. Use only treatment prescribed for you, following your own clinician’s instructions.`,source:3}],Ir={sources:Pr,questions:Fr}})),Rr,zr,Br,Vr,Hr,Ur,Wr=o((()=>{Rr=[{key:`niddk`,title:`Prescription Medications to Treat Overweight and Obesity`,organization:`NIDDK`,url:`https://www.niddk.nih.gov/health-information/weight-management/prescription-medications-treat-overweight-obesity`,type:`GOVERNMENT_GUIDANCE`},{key:`guys_food`,title:`Food and nutrition when taking weight-loss medicines`,organization:`Guy’s and St Thomas’ NHS Foundation Trust`,url:`https://www.guysandstthomas.nhs.uk/health-information/dietary-advice-people-taking-weight-loss-medicines/food-and-nutrition`,type:`CLINICAL_GUIDANCE`},{key:`guys_side`,title:`Managing side effects with diet`,organization:`Guy’s and St Thomas’ NHS Foundation Trust`,url:`https://www.guysandstthomas.nhs.uk/health-information/lifestyle-advice-people-taking-weight-loss-medicines/managing-side-effects-diet`,type:`CLINICAL_GUIDANCE`},{key:`nhs`,title:`NHS: prescription weight and diabetes medicines (GLP-1)`,organization:`NHS`,url:`https://www.nhs.uk/medicines/semaglutide/`,type:`GOVERNMENT_GUIDANCE`},{key:`cdc`,title:`Adult Activity: An Overview`,organization:`CDC`,url:`https://www.cdc.gov/physical-activity-basics/guidelines/adults.html`,type:`GOVERNMENT_GUIDANCE`},{key:`who`,title:`WHO: obesity and GLP-1 therapies (questions and answers)`,organization:`World Health Organization`,url:`https://www.who.int/news-room/questions-and-answers/item/obesity-glp-1-therapies`,type:`CLINICAL_GUIDANCE`},{key:`nice`,title:`NICE guidance: medicine for managing overweight and obesity in adults`,organization:`NICE`,url:`https://www.nice.org.uk/guidance/ta1026/chapter/1-Recommendations`,type:`CLINICAL_GUIDANCE`},{key:`step1`,title:`Weight regain after stopping a weekly GLP-1 medicine: STEP 1 trial extension`,organization:`Wilding et al., Diabetes, Obesity and Metabolism (2022)`,url:`https://pubmed.ncbi.nlm.nih.gov/35441470/`,type:`PEER_REVIEWED_RESEARCH`},{key:`misra`,title:`Consensus statement for diagnosis of obesity, abdominal obesity and the metabolic syndrome for Asian Indians`,organization:`Misra et al., Journal of the Association of Physicians of India (2009)`,url:`https://pubmed.ncbi.nlm.nih.gov/19582986/`,type:`PEER_REVIEWED_RESEARCH`},{key:`leanmass`,title:`Lean mass changes with incretin therapy versus lifestyle intervention: a meta-analysis`,organization:`Eisa and Barood, Diabetes, Obesity and Metabolism (2026)`,url:`https://pubmed.ncbi.nlm.nih.gov/41877354/`,type:`PEER_REVIEWED_RESEARCH`},{key:`bodycomp`,title:`Body composition principles for fat-free and skeletal muscle loss with GLP-1 treatments`,organization:`Tinsley and Heymsfield, Journal of the Endocrine Society (2024)`,url:`https://pubmed.ncbi.nlm.nih.gov/39372917/`,type:`PEER_REVIEWED_RESEARCH`}],zr=[{url:`https://www.nhs.uk/medicines/semaglutide/`,title:`NHS: prescription weight and diabetes medicines (GLP-1)`}],Br=[{number:18,topic:`DIABETES`}],Vr=[6,7,20],Hr=[{number:22,topic:`SAFETY`,type:`SCENARIO_BASED`,category:`TREATMENT_SAFETY`,text:`You are planning a pregnancy after your cousin’s wedding. A forward says GLP-1 medicines are safe for everyone. What is the sensible move?`,options:[`Start now and sort out the rest later`,`Tell a doctor about your plans before any decision`,`Wait for a friend who tried it to confirm`],correct:1,explanation:`Safety depends on the person. Pregnancy plans, health history and other medicines all matter, and these medicines are not used in pregnancy. A doctor weighs this before anything is prescribed.`,sourceKeys:[`niddk`,`who`],claim:`Weight-management medicines are not for everyone and are not used in pregnancy or when planning one; a doctor decides after an individual review.`},{number:23,topic:`SAFETY`,type:`SCENARIO_BASED`,category:`TREATMENT_SAFETY`,text:`An Instagram seller offers a cheaper pen with no prescription needed. What is the safer call?`,options:[`Ask the seller which dose to start with`,`Buy it if the reviews look good`,`Use only what your doctor prescribes, from a registered pharmacy`],correct:2,explanation:`Some websites sell fake weight-loss medicines. Prescription medicines should come from a registered pharmacy, on a prescription from your own doctor, with follow-up.`,sourceKeys:[`nhs`,`niddk`],claim:`Some websites sell fake weight-loss medicines; prescription medicines should be bought from a registered or approved pharmacy as directed by a health professional.`},{number:24,topic:`SIDE_EFFECTS`,type:`SCENARIO_BASED`,category:`TREATMENT_SAFETY`,text:`It is a heavy, fried paratha day in the office tiffin and you feel queasy while on treatment. What often feels easier?`,options:[`Skipping lunch to avoid feeling sick`,`Smaller, lighter meals through the day`,`A bigger dinner to make up for it`],correct:1,explanation:`Smaller, plainer meals more often tend to sit better, while fatty foods can make nausea worse. If you cannot keep fluids down, contact your care team.`,sourceKeys:[`guys_side`],claim:`Eating small meals more often and avoiding fatty foods can help with nausea; being unable to keep down fluids needs the care team.`},{number:25,topic:`SIDE_EFFECTS`,type:`SCENARIO_BASED`,category:`HEALTHY_HABITS`,text:`After a long commute with little water, you feel constipated on treatment. What can help?`,options:[`Water, dal or sabzi for fibre, and a short walk`,`Cutting out all fibre`,`Borrowing a friend’s tablets`],correct:0,explanation:`Slower digestion and eating less can cause constipation. Fluids, fibre from dal, sabzi and fruit, and a short walk can help. If it does not settle, tell your care team.`,sourceKeys:[`guys_side`,`who`],claim:`Constipation is a common effect; fluids, fibre from lentils, vegetables and fruit, and movement can help, and persistent symptoms should go to the care team.`},{number:26,topic:`MUSCLE`,type:`MYTH_OR_FACT`,category:`HEALTHY_HABITS`,text:`Myth or fact: muscle is lost only with weight-loss medicines, never with plain dieting.`,options:[`Myth`,`Fact`],correct:0,explanation:`Myth. Some muscle can be lost with any significant weight loss, including through diet alone. Strength training and enough protein help limit it.`,sourceKeys:[`leanmass`,`guys_food`],claim:`The share of weight lost as lean mass is broadly comparable between incretin-based therapy and lifestyle weight loss; resistance training and protein help preserve muscle.`},{number:27,topic:`MUSCLE`,type:`SCENARIO_BASED`,category:`NUTRITION`,text:`Poha or idli for breakfast leaves you hungry by 11 am. Which addition brings in protein?`,options:[`A second cup of sweet chai`,`Extra coconut chutney`,`Curd, sprouts or an egg on the side`],correct:2,explanation:`Protein foods such as eggs, curd, dal and sprouts help you feel full and help protect muscle during weight loss. A dietitian can adapt choices to your diet.`,sourceKeys:[`guys_food`],claim:`Protein helps build and maintain muscle and helps you feel full; eggs, lentils, beans and dairy are protein foods.`},{number:28,topic:`MUSCLE`,type:`SCENARIO_BASED`,category:`HEALTHY_HABITS`,text:`You walk every morning and love it. What else helps protect muscle?`,options:[`Walking a longer route is the only thing that matters`,`Strength exercise on two or more days a week`],correct:1,explanation:`Walking is great, and adults also need muscle-strengthening activity on 2 or more days a week. Squats, resistance bands or gym weights all count.`,sourceKeys:[`cdc`,`niddk`],claim:`Adults need muscle-strengthening activity on at least 2 days a week in addition to aerobic activity.`},{number:29,topic:`MUSCLE`,type:`MULTIPLE_CHOICE`,category:`METABOLIC_HEALTH`,text:`The weighing scale shows a drop. What does a body-composition scan such as DEXA add?`,options:[`It tells you which medicine to take`,`It shows how much of the change is fat and how much is lean mass`,`It replaces a doctor’s advice`],correct:1,explanation:`The scale shows total weight only. A body-composition scan separates fat from lean mass, so a care team can see what is changing. It supports a doctor’s judgement, not replaces it.`,sourceKeys:[`bodycomp`,`leanmass`],claim:`Weight loss includes fat mass and fat-free mass; body-composition measurement shows the split, which total weight cannot.`},{number:30,topic:`MAINTENANCE`,type:`SCENARIO_BASED`,category:`DOCTOR_LED_CARE`,text:`Diwali and wedding season knocked your routine off track. “I will restart next Monday” is the plan. What helps long term?`,options:[`Treat it as failure and give up`,`Plan for festivals and keep follow-ups going`,`Wait for the perfect month to restart`],correct:1,explanation:`Weight management is long-term, and festivals and travel are normal life. A good plan expects them and keeps habits and follow-ups going instead of waiting for a perfect restart.`,sourceKeys:[`niddk`,`who`],claim:`Obesity is a chronic condition; healthy eating and activity habits and follow-up continue over the long term.`},{number:31,topic:`MAINTENANCE`,type:`MYTH_OR_FACT`,category:`DOCTOR_LED_CARE`,text:`Myth or fact: in trials, many people regained a good part of their lost weight after stopping a weekly GLP-1 medicine.`,options:[`Fact`,`Myth`],correct:0,explanation:`Fact. In one trial extension, participants regained a good part of their lost weight within a year of stopping. A plan for after, with habits and follow-up, matters.`,sourceKeys:[`step1`,`niddk`],claim:`In the STEP 1 extension participants regained about two-thirds of their prior weight loss a year after withdrawal; NIDDK says some regain is probable after stopping.`},{number:32,topic:`DIABETES`,type:`SCENARIO_BASED`,category:`METABOLIC_HEALTH`,text:`Diabetes runs in your family and you carry weight around your belly, yet your BMI reads “normal”. What is the smart read?`,options:[`A normal BMI rules out any risk`,`Belly fat can signal metabolic risk even at a normal-looking BMI, so ask a doctor about tests`,`Belly fat matters only for people who already have diabetes`],correct:1,explanation:`Indian consensus guidance notes more belly fat and metabolic risk at lower BMI levels than global charts assume. A doctor looks at waist, tests and family history, not BMI alone.`,sourceKeys:[`misra`],claim:`Asian Indians show more abdominal adiposity and the limits of normal BMI are narrower and lower than in white Caucasians.`},{number:33,topic:`DIABETES`,type:`SCENARIO_BASED`,category:`METABOLIC_HEALTH`,text:`A health-camp sugar test came back normal. What else would a doctor want to look at?`,options:[`Nothing, one sugar reading is the whole picture`,`Blood pressure, blood fats, sleep and family history`],correct:1,explanation:`Weight-related conditions include high blood pressure, abnormal blood fats and sleep apnoea as well as diabetes. A doctor looks at the full picture, not one sugar report.`,sourceKeys:[`nice`,`niddk`],claim:`Weight-related health problems include high blood pressure, dyslipidaemia, sleep apnoea, cardiovascular disease and type 2 diabetes; health professionals assess individual risk.`},{number:34,topic:`DIABETES`,type:`SCENARIO_BASED`,category:`TREATMENT_SAFETY`,text:`You take tablets for diabetes. A reel says GLP-1 medicines can replace them. What should you do?`,options:[`Halve your tablets to be safe`,`Stop your tablets and try it`,`Keep taking them and ask your own doctor before any change`],correct:2,explanation:`Never change diabetes medicines because of something you saw online. Some combinations need dose changes and monitoring, and stopping suddenly can affect blood sugar. Your own doctor decides.`,sourceKeys:[`nhs`,`niddk`],claim:`Diabetes medicines and insulin may need adjustment alongside a GLP-1 medicine and treatment should not be stopped suddenly without talking to a doctor.`},{number:35,topic:`DIABETES`,type:`SCENARIO_BASED`,category:`GLP1_AWARENESS`,text:`Your uncle uses a GLP-1 injection for his diabetes. Is his pen and plan automatically right for you?`,options:[`No. Uses and products differ, and a doctor decides what fits you`,`Yes, they are all the same`],correct:0,explanation:`GLP-1 medicines are used for diabetes, for weight management or for both, depending on the product. One person’s prescription is not a plan for someone else.`,sourceKeys:[`nhs`,`who`],claim:`GLP-1 medicines can be used to manage type 2 diabetes or treat obesity depending on the product, and should be prescribed only after individual assessment.`},{number:36,topic:`DIABETES`,type:`MYTH_OR_FACT`,category:`METABOLIC_HEALTH`,text:`Myth or fact: someone who looks slim cannot have metabolic risk.`,options:[`Fact`,`Myth`],correct:1,explanation:`Myth. Many Indians carry extra fat around the belly and organs even at a modest BMI, which raises metabolic risk. Looks are not a reliable guide; tests are.`,sourceKeys:[`misra`],claim:`Asian Indians exhibit excess body fat, abdominal adiposity and fat deposition in ectopic sites such as liver and muscle, driving metabolic syndrome and type 2 diabetes.`},{number:37,topic:`ELIGIBILITY`,type:`MULTIPLE_CHOICE`,category:`DOCTOR_LED_CARE`,text:`Does one BMI number alone decide whether medicine is right for you?`,options:[`Yes, the number settles it`,`No. BMI is one input, and doctors also weigh waist, tests and health conditions`],correct:1,explanation:`BMI is only one input. Guidance sets lower thresholds for people of South Asian background, and doctors also consider waist, health conditions and tests.`,sourceKeys:[`nice`,`misra`,`niddk`],claim:`Eligibility uses BMI together with weight-related health problems, with lower BMI thresholds for South Asian backgrounds.`},{number:38,topic:`ELIGIBILITY`,type:`MULTIPLE_CHOICE`,category:`DOCTOR_LED_CARE`,text:`A clinic asks for blood tests and a body-composition check before any plan. Why?`,options:[`So decisions start from your own data, not a forwarded rule`,`To give everyone the same plan`,`To tick a formality before the real advice`],correct:0,explanation:`Choosing a treatment depends on your current health issues, other medicines and family history. Tests give a doctor your own data to decide with.`,sourceKeys:[`niddk`,`nice`],claim:`Medication choice depends on current health issues, other medicines and family medical history, which a health professional assesses.`},{number:39,topic:`ELIGIBILITY`,type:`SCENARIO_BASED`,category:`TREATMENT_SAFETY`,text:`You are breastfeeding and a neighbour shares her weight plan. What should you do?`,options:[`Follow it, since it worked for her`,`Speak to a doctor first, as these medicines are not recommended while breastfeeding`,`Take half of her dose`],correct:1,explanation:`Weight-loss medicines are not recommended while breastfeeding or pregnant. A doctor can suggest what is suitable for you instead.`,sourceKeys:[`niddk`,`nhs`],claim:`Weight-loss medications are not recommended during pregnancy or breastfeeding.`},{number:40,topic:`ELIGIBILITY`,type:`SCENARIO_BASED`,category:`DOCTOR_LED_CARE`,text:`Your doctor says medicine is not the right step for you right now. What does that mean?`,options:[`Nothing else will work`,`Find another seller`,`Food, movement and behavioural support can still help`],correct:2,explanation:`“Not now” is a valid answer. Healthy eating, activity and behavioural support still help, and your care team can revisit the plan as your situation changes.`,sourceKeys:[`niddk`,`who`],claim:`Medicines are not for everyone with a high BMI; lifestyle programmes remain central and comprehensive care includes diet and activity.`}],Ur={version:9,reviewedBy:null,reviewedOn:null,sources:Rr,retitle:zr,reassign:Br,retire:Vr,questions:Hr}})),Gr=c({disclaimer:()=>Xr,questionPool:()=>_i,questionTopics:()=>vi,questions:()=>$r,revealAnswer:()=>Jr,scoreLocal:()=>Yr,selectQuestions:()=>qr});function Kr(e){let t=[...e];for(let e=t.length-1;e>0;e--){let n=Math.floor(Math.random()*(e+1));[t[e],t[n]]=[t[n],t[e]]}return t}function qr(e=`GENERAL`){if(e===`GENERAL`){let e=new Set;return Kr(
