spring.application.name=backend

# PostgreSQL Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-aged-frost-b4zs7l4u-pooler.c-6.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require}
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD:npg_UDELunK8x9NZ}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Runtime profile
spring.profiles.default=dev

# Security auto-configuration
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Connection pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=3000

# Flyway
spring.flyway.enabled=true

# JSON and request limits
spring.jackson.default-property-inclusion=non_null
spring.servlet.multipart.max-request-size=16KB
server.tomcat.max-http-form-post-size=16KB

# Server
server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# MetaboQuest
metaboquest.frontend-url=${FRONTEND_URL:http://localhost:5173}
metaboquest.steer-website-url=${STEER_WEBSITE_URL:https://steerclub.com}
metaboquest.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
metaboquest.session-ttl=${SESSION_TTL:PT30M}
metaboquest.challenge-ttl=${CHALLENGE_TTL:P14D}
metaboquest.result-disclaimer=This quiz is for general educational purposes only. It does not provide medical advice, diagnosis, or treatment recommendations.
metaboquest.result-token.secret=${RESULT_TOKEN_SECRET:local-development-result-token-secret-change-me}

# OpenAPI and Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true

# Configurable game rules
metaboquest.game.points-per-correct-answer=${QUIZ_POINTS_PER_CORRECT:100}
metaboquest.game.smart-strategist-min-score=${QUIZ_SMART_STRATEGIST_MIN_SCORE:200}
metaboquest.game.myth-buster-min-score=${QUIZ_MYTH_BUSTER_MIN_SCORE:300}

# Distributed PostgreSQL-backed rate limiting
metaboquest.rate-limit.window=${RATE_LIMIT_WINDOW:PT1M}
metaboquest.rate-limit.quiz-submission-limit=${RATE_LIMIT_QUIZ_SUBMISSIONS:30}
metaboquest.rate-limit.challenge-creation-limit=${RATE_LIMIT_CHALLENGES:10}
metaboquest.rate-limit.analytics-event-limit=${RATE_LIMIT_ANALYTICS_EVENTS:120}
metaboquest.rate-limit.hash-secret=${RATE_LIMIT_HASH_SECRET:local-development-rate-limit-key}
